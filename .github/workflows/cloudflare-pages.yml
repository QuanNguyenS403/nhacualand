name: Cloudflare Pages Deployment (Path B)

on:
  push:
    branches:
      - 'deploy/**'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Next.js on Linux & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js (20.18.0)
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build Next.js for Cloudflare Pages (@cloudflare/next-on-pages)
        env:
          CF_PAGES: '1'
          NODE_ENV: production
          INTERNAL_API_URL: https://api.nhacualand.com
          NEXT_PUBLIC_API_URL: https://api.nhacualand.com
          NEXT_PUBLIC_SITE_URL: https://nhacualand.com
        run: pnpm run pages:build

      - name: Deploy to Cloudflare Pages (Direct Upload)
        if: ${{ env.HAVE_TOKEN == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HAVE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          pnpm dlx wrangler pages deploy apps/web/.vercel/output/static --project-name=nhacualand --branch=${{ github.ref_name }}
