# CẤU HÌNH CLOUDFLARE PAGES (không phải Workers)
# - Chỉ dùng cho dự án tạo ở Workers & Pages > tab "Pages" > Connect to Git
# - Lệnh `wrangler deploy` (lệnh mặc định của Workers Builds) sẽ báo lỗi
#   "It looks like you've run a Workers-specific command in a Pages project" khi file này có pages_build_output_dir
# - Nếu bắt buộc dùng Workers Builds, đặt Deploy command = npx wrangler pages deploy apps/web/.vercel/output/static --project-name=nhacualand
name = "nhacualand-web"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"
