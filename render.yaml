# ====================================================================
# Render Blueprint Specification (render.yaml)
# Hướng dẫn: Đẩy repo lên GitHub, vào Render Dashboard chọn "New +" > "Blueprint"
# Hoặc tạo Web Service thủ công như trong ảnh hướng dẫn
# ====================================================================

version: "1"

databases:
  - name: nhacualand-postgres
    databaseName: batdongsan
    user: batdongsan
    region: singapore
    plan: starter
    ipAllowList: []

services:
  # ------------------------------------------------------------------
  # DỊCH VỤ DUY NHẤT: GỘP CẢ BACKEND API VÀ FRONTEND WEB (qns_broker)
  # ------------------------------------------------------------------
  - type: web
    name: qns-broker
    runtime: node
    region: singapore
    plan: starter
    branch: main
    buildCommand: bash scripts/render-build.sh
    startCommand: node scripts/start-all.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nhacualand-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateCryptoKey: true
      - key: JWT_REFRESH_SECRET
        generateCryptoKey: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: "https://nhacualand.com,https://www.nhacualand.com,https://qns-broker.onrender.com,http://localhost:3000"
      - key: ADMIN_PHONE
        value: "0981753082"
