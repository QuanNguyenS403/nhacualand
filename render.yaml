# ====================================================================
# Render Blueprint Specification (render.yaml) — NHACUALAND
# Nền tảng tìm phòng trọ, căn hộ, studio cho thuê minh bạch chi phí
# Triển khai gộp 1 Web Service duy nhất trên Render (thay thế hoàn toàn Cloudflare Tunnel)
# ====================================================================

version: "1"

databases:
  - name: nhacualand-postgres
    databaseName: batdongsan
    user: batdongsan
    region: singapore
    plan: starter
    ipAllowList: []

services:
  # ------------------------------------------------------------------
  # DỊCH VỤ DUY NHẤT: GỘP CẢ BACKEND API VÀ FRONTEND WEB (nhacualand)
  # ------------------------------------------------------------------
  - type: web
    name: nhacualand
    runtime: node
    region: singapore
    plan: starter
    branch: main
    buildCommand: bash scripts/render-build.sh
    startCommand: node scripts/start-all.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: COREPACK_INTEGRITY_KEYS
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: nhacualand-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateCryptoKey: true
      - key: JWT_REFRESH_SECRET
        generateCryptoKey: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: "https://nhacualand.com,https://www.nhacualand.com,https://nhacualand.onrender.com,http://localhost:3000"
      - key: ADMIN_PHONE
        value: "0981753082"
      - key: ADMIN_BOOTSTRAP_SECRET
        generateCryptoKey: true
      - key: ADMIN_BOOTSTRAP_PHONE
        value: "0981753082"
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: ADMIN_BOOTSTRAP_FULLNAME
        value: "Chủ nhà"
      - key: ADMIN_MFA_ENFORCED
        value: "false"
      - key: ADMIN_MFA_SECRET
        generateCryptoKey: true
      - key: ADMIN_NOTIFICATION_EMAIL
        value: ducquan16102006@gmail.com
      - key: MAIL_DRIVER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: ducquan16102006@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "NHACUALAND <ducquan16102006@gmail.com>"
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://nhacualand.com/auth/google/callback
      - key: STORAGE_DRIVER
        value: local
      - key: NEXT_PUBLIC_SITE_URL
        value: https://nhacualand.com
      - key: NEXT_PUBLIC_API_URL
        value: ""
